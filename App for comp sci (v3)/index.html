<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <section id="nav-section">
        <nav>
          <div class="logo">
            <h2>Camping search</h2>
          </div>
          <div class="nav__links">
            <a href="#">Shop</a>
            <a href="#">Contact</a>
            <a href="#">Register</a>
            <div class="cart">
              <img class="cart-icon" height="40px" src="./images/cart.png" alt="Cart"/>
              <span class="cart-quantity">0</span>
            </div>
          </div>
        </nav>
      </section>
      <section id="header-section">
        <div class="header__container">
          <h1>Camping Search</h1>
        </div>
      </section>
    </header>

    <main>
      <section id="timer">
        <div class="timer__container">
          <div class="offer-text">
            <h3>
              <span class="text-1"> Register now </span>
              <span class="text-2"> Before it is too late!</span>
            </h3>
          </div>
          <div class="time">
            <h3 class="timestamp">60:00</h3>
            <img src="./images/pug.png" alt="timer"/>
          </div>
        </div>
      </section>
     <section id="camping-suggestions" class="product-section">
        <h1>Camping spots</h1>
        <div class="camping__container product__container"></div>
      </section>
      <section id="tools-suggestions" class="product-section">
        <h1>Recommended tools </h1>
        <div class="tool__container product__container">
        </div>
      </section>
      <section id="cart">
        <div class="cart__container">
          <div class="part__1">
            <h2>Shopping Cart</h2>
            <img class="close-cart" src="./images/x.png" alt="Close" />
          </div>
          <div class="part__2 cart_part__2"></div>
          <div class="part__3">
            <h3>
              Price: 
              <span class="total-price">$0</span>
            </h3>
            <button>Buy Now</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/ScrollingHeader.js"></script>
    <script type="module" src="./js/controller.js"></script>
  </body>
</html>
